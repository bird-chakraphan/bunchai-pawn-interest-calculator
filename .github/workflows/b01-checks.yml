name: B01 development checks

on:
  push:
    branches: [codex/b01-isolated-environment, 'codex/bunchai-*']
  pull_request:
    branches: [codex/bunchai-integration]

permissions:
  contents: read

concurrency:
  group: b01-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Compile the local-test application
        run: npm run build
        env:
          # Nonfunctional placeholders for compilation only. No database runs in this job.
          # Runtime/auth/recovery checks use keys generated by the separate local stack.
          NEXT_PUBLIC_BUNCHAI_ENVIRONMENT: local-test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-no-auth-public
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-no-auth-server
          APP_BASE_URL: http://127.0.0.1:3000
          PAYMENTS_ENABLED: 'false'
          INTERNAL_SYNC_SECRET: ''
          OMISE_SECRET_KEY: ''
          LINE_CHANNEL_ACCESS_TOKEN: ''
          LINE_GROUP_ID: ''
